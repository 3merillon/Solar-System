[package]
name = "solar-bake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Native bake of the Solar-System v2 data packs (pinned Earth, other bodies, sky). Never compiled to WASM."

[dependencies]
solar-core = { path = "../solar-core" }
tiff = "0.9"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
exr = { version = "1.72", default-features = false }
flate2 = "1"
sha2 = "0.10"
serde_json = "1"
zopfli = { version = "0.8", default-features = false, features = ["zlib", "std"] }

[dev-dependencies]
png = "0.17"
