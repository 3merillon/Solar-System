<!doctype html><meta charset="utf-8"><title>music lab</title>
<body>music lab: offline renders for tools/Render-Music.mjs (served beside the music modules)
<script type="module">
import {createEngine} from './music-engine.js';
import {makeTheme,composeBar,MOOD_NAMES} from './music-composer.js';
import {Q} from './music-theory.js';
import {toModule} from './music-rmt.js';
import {noteOf,orreryOf,kindOf,bodyNamed,TRAITS,BASE_HZ} from './music-director.js';
// Render a script of pieces offline. job: {seconds, rate, lite, energy, script:[{at, mood, seed, base:'3/2', ...spec, fade}|{at, accent, ...}]}
// Returns measurements; the sound stays in window.lastRender until fetched in pieces by wavChunk().
// place: a body's name; its note, orrery and leanings are then the director's own (as on the live page).
const fix=o=>{const c={...o};if(c.place){const id=bodyNamed(c.place),t=TRAITS[kindOf(id)];if(!id)throw Error('No body named '+c.place);c.base=noteOf(id);c.orbit=orreryOf(id);c.light??=t.light;c.heat??=t.heat;c.rich??=!!t.rich;c.hz=BASE_HZ;}
 if(typeof c.base==='string')c.base=Q.of(c.base);if(c.orbit&&typeof c.orbit[0]?.by==='string')c.orbit=c.orbit.map(b=>({name:b.name,by:Q.of(b.by)}));return c;};
window.fixSpec=fix;
// The first bars of a job's first piece as an RMT module (JSON text), for the listening page.
window.moduleJob=(spec,bars=16)=>{const T=makeTheme(fix(spec));return JSON.stringify(toModule(T,{from:0,bars:Math.min(bars,T.length)}),null,1);};
window.renderJob=async job=>{
 const rate=job.rate||48000,ac=new OfflineAudioContext(2,Math.ceil(job.seconds*rate),rate),engine=createEngine(ac,{lite:!!job.lite,offline:true});
 engine.setEnergy(job.energy??.5);
 // solo: keep one layer of the piece (a stem), to weigh the layers against each other.
 const labels=[],script=job.script.map(s=>{if(s.mood){const theme=makeTheme({...fix(s),lite:!!job.lite});if(s.solo!=null){const keep=theme.layers[s.solo];labels.push(keep?`${keep.type}:${keep.voice||keep.wave||''}`:'none');theme.layers=keep?[keep]:[];}else labels.push(theme.label);return {at:s.at,theme,fade:s.fade,dip:s.dip};}return fix(s);});
 const t0=performance.now(),stats=engine.render(script,job.seconds,job.volume??.24),t1=performance.now();
 const buffer=await ac.startRendering(),t2=performance.now();
 const L=buffer.getChannelData(0),R=buffer.getChannelData(1),n=L.length;
 let peak=0,sum=0,bad=0,dc=0,side=0,mid=0;
 for(let i=0;i<n;i++){const a=L[i],b=R[i];if(!Number.isFinite(a)||!Number.isFinite(b)){bad++;continue;}const m=Math.max(Math.abs(a),Math.abs(b));if(m>peak)peak=m;sum+=(a*a+b*b)/2;dc+=(a+b)/2;mid+=(a+b)*(a+b)/4;side+=(a-b)*(a-b)/4;}
 // Loudness second by second, and energy in four bands (one-pole splits: enough to see mud or glare).
 const perSecond=[];for(let s=0;s+rate<=n;s+=rate){let e=0;for(let i=s;i<s+rate;i++)e+=(L[i]*L[i]+R[i]*R[i])/2;perSecond.push(+(10*Math.log10(e/rate+1e-12)).toFixed(1));}
 const bands=[0,0,0,0],cut=[150,800,4000].map(f=>1-Math.exp(-2*Math.PI*f/rate));let y=[0,0,0];
 for(let i=0;i<n;i++){const x=(L[i]+R[i])/2;y[0]+=cut[0]*(x-y[0]);y[1]+=cut[1]*(x-y[1]);y[2]+=cut[2]*(x-y[2]);const b0=y[0],b1=y[1]-y[0],b2=y[2]-y[1],b3=x-y[2];bands[0]+=b0*b0;bands[1]+=b1*b1;bands[2]+=b2*b2;bands[3]+=b3*b3;}
 window.lastRender={L,R,rate,n};
 const db=v=>+(20*Math.log10(Math.max(v,1e-9))).toFixed(2);
 return {labels,seconds:job.seconds,peak:+peak.toFixed(4),peakDb:db(peak),rmsDb:db(Math.sqrt(sum/n)),bad,dc:+(dc/n).toExponential(2),sideOverMidDb:+(10*Math.log10((side+1e-12)/(mid+1e-12))).toFixed(1),
  bandsDb:bands.map(b=>+(10*Math.log10(b/n+1e-12)).toFixed(1)),perSecond,voicesPeak:+stats.peak.toFixed(1),dropped:stats.dropped,spawned:stats.spawned,bars:stats.bars,scheduleMs:+(t1-t0).toFixed(0),renderMs:+(t2-t1).toFixed(0)};
};
// 16-bit WAV of the last render, normalised to a target loudness for listening (the measurements above are of the raw render).
window.wavPrepare=(targetRmsDb=-20,ceilingDb=-1)=>{
 const {L,R,rate,n}=window.lastRender;let peak=1e-9,sum=0;for(let i=0;i<n;i++){peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]));sum+=(L[i]*L[i]+R[i]*R[i])/2;}
 const gain=Math.min(10**(targetRmsDb/20)/Math.sqrt(sum/n+1e-12),10**(ceilingDb/20)/peak),bytes=new Uint8Array(44+n*4),v=new DataView(bytes.buffer);
 const text=(o,s)=>{for(let i=0;i<s.length;i++)bytes[o+i]=s.charCodeAt(i);};
 text(0,'RIFF');v.setUint32(4,36+n*4,true);text(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,rate,true);v.setUint32(28,rate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,n*4,true);
 // A fade of 30 ms at each end, so a cut file does not click.
 const edge=Math.floor(rate*.03);
 for(let i=0;i<n;i++){const f=Math.min(1,i/edge,(n-1-i)/edge)*gain;v.setInt16(44+i*4,Math.max(-32767,Math.min(32767,Math.round(L[i]*f*32767))),true);v.setInt16(46+i*4,Math.max(-32767,Math.min(32767,Math.round(R[i]*f*32767))),true);}
 window.lastWav=bytes;return {bytes:bytes.length,gainDb:+(20*Math.log10(gain)).toFixed(1)};
};
window.wavChunk=(offset,size)=>{const part=window.lastWav.subarray(offset,offset+size);let s='';for(let i=0;i<part.length;i+=8192)s+=String.fromCharCode.apply(null,part.subarray(i,i+8192));return btoa(s);};
// One note of each voice, dry, at the same written gain: how loud each instrument really is (peak, and the loudest half second).
import {shared,createRack,createMaster,spawn} from './music-synth.js';
window.probeVoices=async()=>{
 const rate=48000,out={};
 for(const [v,kind] of Object.entries({partial:'held',sub:'held',pad:'held',choir:'held',glass:'held',string:'held',lead:'held',bass:'held',bell:'struck',gong:'struck',piano:'struck',pluck:'struck',metal:'struck',tom:'struck',kick:'struck',snare:'struck',clap:'struck',hat:'struck'})){
  out[v]={kind};
  for(const f of v==='sub'||v==='bass'||v==='kick'||v==='tom'?[55]:v==='hat'?[8000]:[220,660]){
   const ac=new OfflineAudioContext(2,rate*4,rate),S=shared(ac),R=createRack(ac,S,{ir:'plate',wet:0,tone:18000,air:0,vowelsA:['a'],vowelsB:['a']},{});
   R.out.gain.value=1;R.out.connect(ac.destination);
   spawn(ac,S,R,{v,f,g:.1,d:kind==='held'?2:.2,a:.05,r:kind==='held'?.3:2,b:.5,bus:v==='choir'?'choirA':'dry',pri:3},.05);
   const b=await ac.startRendering(),L=b.getChannelData(0);let peak=0,best=0;
   for(let i=0;i<L.length;i++)peak=Math.max(peak,Math.abs(L[i]));
   for(let s=0;s+rate/2<=L.length;s+=rate/8){let e=0;for(let i=s;i<s+rate/2;i++)e+=L[i]*L[i];best=Math.max(best,e/(rate/2));}
   out[v][f]={peakDb:+(20*Math.log10(peak+1e-9)).toFixed(1),rmsDb:+(10*Math.log10(best+1e-12)).toFixed(1)};
  }
 }
 return out;
};
// The layers of a piece, for the stems tool.
window.layersOf=spec=>makeTheme(window.fixSpec(spec)).layers.map(l=>`${l.type}:${l.voice||l.wave||''}`);
window.moods=MOOD_NAMES;window.labReady=true;
</script>
